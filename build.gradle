plugins {
	id 'java'
	id 'org.springframework.boot' version '3.2.10'
	id 'io.spring.dependency-management' version '1.1.6'
	id 'org.asciidoctor.jvm.convert' version '3.3.2'
}

group = 'com.pape'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}

	asciidoctorExt
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa' // SpringDataJPA 
	implementation 'org.springframework.boot:spring-boot-starter-security' // SpringSecurity
	implementation ('org.springframework.boot:spring-boot-starter-web') { // SpringWeb
		exclude group: "org.springframework.boot", module: "spring-boot-starter-tomcat" // 톰캣 제거
	}
	implementation 'org.springframework.boot:spring-boot-starter-undertow' // UnderTow 사용 - 대체 WAS
	implementation 'org.bgee.log4jdbc-log4j2:log4jdbc-log4j2-jdbc4.1:1.16' // DB Query조회 로깅
	implementation 'com.querydsl:querydsl-jpa:5.0.0:jakarta' // QueryDSL 라이브러리
	implementation 'org.springframework.boot:spring-boot-starter-validation' // Spring Validtion
	implementation 'io.jsonwebtoken:jjwt-api:0.11.5' // JWT 토큰 라이브러리
	implementation 'org.springframework.boot:spring-boot-starter-mail' // Spring Mail
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.3.0' // Swagger-UI
	implementation 'com.google.firebase:firebase-admin:9.2.0' // FCM을 위한 라이브러리
	implementation 'org.springframework.boot:spring-boot-starter-thymeleaf' // Spring Thymeleaf
	implementation 'org.json:json:20220320' // ..?
    implementation 'com.googlecode.json-simple:json-simple:1.1.1' // JSON Object 사용

	asciidoctorExt 'org.springframework.restdocs:spring-restdocs-asciidoctor' // Spring Rest Docs

	compileOnly 'org.projectlombok:lombok' // Lombok

	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5' // JWT 토큰 라이브러리
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5' // JWT 토큰 라이브러리
	runtimeOnly 'com.mysql:mysql-connector-j' // MySQL JDBC
	runtimeOnly 'com.h2database:h2' // H2

	annotationProcessor 'org.projectlombok:lombok' 
	annotationProcessor 'jakarta.persistence:jakarta.persistence-api:3.1.0' // QueryDSL 라이브러리
	annotationProcessor "com.querydsl:querydsl-apt:5.0.0:jakarta" // QueryDSL 라이브러리

	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testImplementation 'org.springframework.security:spring-security-test'
	testImplementation 'org.springframework.restdocs:spring-restdocs-mockmvc'

	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

tasks.named('test') {
	useJUnitPlatform()
}

// Querydsl 설정부
def generated = 'src/main/generated'

// querydsl QClass 파일 생성 위치를 지정
tasks.withType(JavaCompile) {
	options.getGeneratedSourceOutputDirectory().set(file(generated))
	options.compilerArgs << "-Xlint:unchecked" // 컴파일러 경고 플래그 추가
}

// java source set 에 querydsl QClass 위치 추가
sourceSets {
	main.java.srcDirs += [ generated ]
}

// gradle clean 시에 QClass 디렉토리 삭제
clean {
	delete file(generated)
}

ext {
    snippetsDir = file('build/generated-snippets')
}

tasks {
    def isTest = gradle.startParameter.excludedTaskNames.contains('test')

    if (!isTest) {
        asciidoctor {
            dependsOn test
            inputs.dir snippetsDir
            doFirst {
                delete file('src/main/resources/static/docs')
            }
        }
    }

    test {
        outputs.dir snippetsDir
    }


    bootJar {
        if (!isTest) {
            dependsOn asciidoctor
            from("${asciidoctor.outputDir}/html5") {
                into 'static/docs'
            }
        }
    }

    task copyDocument(type: Copy) {
        if (!isTest) {
            dependsOn asciidoctor
            from file("build/docs/asciidoc")
            into file("src/main/resources/static/docs")
        }
    }

    build {
        if (!isTest) {
            dependsOn copyDocument
        }
    }

}