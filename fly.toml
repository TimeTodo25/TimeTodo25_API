app = "your-app-name"
primary_region = "nrt" # Tokyo region (한국에서 가장 가까운 리전)

[build]

[env]
SPRING_PROFILES_ACTIVE = "prod"

[http_service]
internal_port = 8080
force_https = true
auto_stop_machines = true
auto_start_machines = true
min_machines_running = 0

[[vm]]
cpu_kind = "shared"
cpus = 1
memory_mb = 512