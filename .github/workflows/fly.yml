name: CI/CD Fly

on:
  push:
    branches: [ "release2" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Github Repository 파일 불러오기
        uses: actions/checkout@v3

      - name: JDK 17버전 설치
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: application.yml 파일 만들기
        run: |
          echo "${{ secrets.APPLICATION_YML }}" > ./src/main/resources/application.yml
        shell: bash

      - name: application-dev.yml 파일 만들기
        run: |
          echo "${{ secrets.APPLICATION_DEV_YML }}" > ./src/main/resources/application-dev.yml
        shell: bash

      - name: jwt.yml 파일 만들기
        run: |
          printf "%s" "${{ secrets.JWT_YML }}" > ./src/main/resources/jwt.yml
        shell: bash

      - name: Firebase Service Key 생성
        run: |
          mkdir -p ./src/main/resources/firebase
          printf "%s" "${{ secrets.FIREBASE_KEY }}" > ./src/main/resources/firebase/timetodo2024-key.json
        shell: bash

      - name: gradlew 실행 권한 부여
        run: chmod +x ./gradlew

      - name: 테스트 및 빌드하기
        run: ./gradlew clean build

      - name: Fly.io CLI 설치
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Fly.io 배포
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}